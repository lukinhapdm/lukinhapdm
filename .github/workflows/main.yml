YAML
# Name of the workflow displayed in the GitHub Actions tab
name: Generate Snake

on:
  # Run each commit in the main branch
  push:
    branches:
      - main
  # Runs automatically once every day at midnight (UTC)
  schedule:
    - cron: "0 0 * * *"
  # Allows manual execution from the Actions tab on GitHub
  workflow_dispatch:

# Grant write permissions to the GITHUB_TOKEN
permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      # Generates the snake contribution graphs
      - uses: Platane/snk@v3
        with:
          github_user_name: lukinhapdm
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#770b9d&color_dots=#12031a,#4a0e63,#770b9d,#9d21c4,#c55be6

      # Publishes the generated files to the 'output' branch
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
